  <style>
    /* BLOG STYLESHEET — Clean, readable, mobile-first */
    :root {
      --bg: #0f0f0f;
      --text: #e8e8e8;
      --text-muted: #999;
      --accent: #e85d3a;
      --accent-hover: #ff7a55;
      --border: #2a2a2a;
      --card: #1a1a1a;
      --max-width: 720px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.8;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
    
    /* Nav */
    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    header .container {
      display: flex; justify-content: space-between; align-items: center;
    }
    header a {
      color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    header a:hover { color: var(--accent); }
    header .brand { font-size: 18px; }
    
    /* Article */
    article { padding-bottom: 64px; }
    .category-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 3px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 36px;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    .meta {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .meta span { margin-right: 16px; }
    
    /* Content */
    h2 { font-size: 26px; margin: 48px 0 16px; line-height: 1.3; }
    h3 { font-size: 21px; margin: 32px 0 12px; line-height: 1.3; }
    p { margin-bottom: 20px; }
    p.lede { font-size: 19px; color: var(--text-muted); margin-bottom: 32px; }
    
    /* Lists */
    ul, ol { margin: 0 0 24px 24px; }
    li { margin-bottom: 10px; }
    
    /* Blockquotes (for anecdotes) */
    blockquote {
      border-left: 4px solid var(--accent);
      padding: 16px 24px;
      margin: 32px 0;
      background: var(--card);
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    blockquote strong { font-style: normal; }
    
    /* Key point boxes */
    .key-point {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin: 32px 0;
    }
    .key-point h3 { margin-top: 0; color: var(--accent); font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Related posts */
    .related {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      margin-top: 32px;
    }
    .related h3 { margin-bottom: 16px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .related ul { list-style: none; margin: 0; }
    .related li { margin-bottom: 8px; }
    .related a { color: var(--accent); text-decoration: none; }
    .related a:hover { text-decoration: underline; }
    
    /* CTA */
    .cta-box {
      background: linear-gradient(135deg, var(--accent), #d44a28);
      border-radius: 12px;
      padding: 32px;
      margin: 48px 0;
      text-align: center;
    }
    .cta-box h3 { color: #fff; margin: 0 0 8px; font-size: 22px; }
    .cta-box p { color: rgba(255,255,255,0.8); margin: 0 0 20px; }
    .cta-box a {
      display: inline-block;
      background: #fff;
      color: var(--accent);
      padding: 12px 32px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.2s;
    }
    .cta-box a:hover { transform: scale(1.05); }
    
    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      margin-top: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 28px; }
      h2 { font-size: 22px; }
      body { font-size: 16px; }
    }
  </style>
